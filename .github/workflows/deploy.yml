name: Deploy Science News to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.json'
      - '**/*.json'
      - 'generate.js'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # QUITADO cache: 'npm' y cache-dependency-path
          # Esto evita el error de caché

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install --no-audit --no-fund
          echo "✅ Dependencies installed"

      - name: Verify structure
        run: |
          echo "📁 Repository structure:"
          ls -la
          echo ""
          echo "📄 Checking index.json:"
          if [ -f "index.json" ]; then
            echo "✅ index.json found"
            cat index.json | head -20
          else
            echo "❌ index.json NOT found"
            exit 1
          fi
          echo ""
          echo "📂 Checking year folders:"
          find . -maxdepth 3 -name "*.json" -not -path "./node_modules/*" -not -name "package*.json" | head -20

      - name: Generate science news HTML
        run: |
          echo "🔄 Generating HTML..."
          node generate.js
          echo "✅ Generation complete"

      - name: List generated files
        run: |
          echo "📁 Generated files:"
          if [ -d "news" ]; then
            echo "✅ news directory exists:"
            ls -la news/ | head -20
          else
            echo "⚠️ No news directory found"
          fi
          echo ""
          if [ -d "images/news" ]; then
            echo "✅ images/news directory exists:"
            ls -la images/news/ | head -20
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Science news deployed successfully!"
          echo "📊 URL: https://revista1919.github.io/science/"
          echo "🔗 Deployed at: ${{ steps.deployment.outputs.page_url }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs for details"
          exit 1