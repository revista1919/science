name: Deploy Science News to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.json'                # Índice en la raíz
      - '**/*.json'                 # Cualquier JSON en carpetas de año (2026/, 2025/, etc.)
      - 'generate.js'               # Generador
      - 'package.json'              # Dependencias
      - 'package-lock.json'         # Lock file (si existe)
      - '.github/workflows/deploy.yml' # Este workflow
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          if [ -f package-lock.json ]; then
            echo "✅ package-lock.json found, using npm ci"
            npm ci
          else
            echo "⚠️ No package-lock.json, using npm install"
            npm install
          fi

      - name: Verify structure
        run: |
          echo "📁 Repository structure:"
          ls -la
          echo ""
          echo "📄 index.json exists:"
          test -f index.json && echo "✅ Yes" || echo "❌ No"
          echo ""
          echo "📂 Year folders:"
          find . -maxdepth 2 -name "news-*.json" -o -name "*.json" | head -20

      - name: Generate science news HTML
        run: |
          echo "🔄 Generating HTML..."
          npm run generate
          echo "✅ Generation complete"

      - name: List generated files
        run: |
          echo "📁 Generated files:"
          if [ -d "news" ]; then
            ls -la news/
          else
            echo "⚠️ No news directory found"
          fi
          echo ""
          if [ -d "images/news" ]; then
            echo "🖼️ Images:"
            ls -la images/news/ | head -20
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Science news deployed successfully!"
          echo "📊 URL: https://revista1919.github.io/science/"
          echo "🔗 Deployed at: ${{ steps.deployment.outputs.page_url }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs for details"
          exit 1